<title>Бяцхан зураач</title>

<style>
/* Layout: classroom smart-board app. Soft sage ground, white rounded panels, teal primary, lavender/sky secondary buttons, orange start. Picker screen, then a two-pane draw screen (Хар | Чиний цаас) with a bottom control bar. */
:root{
  --bg:#EEF4F0; --bg2:#F3F0F9; --card:#FFFFFF; --soft:#F0F4F8;
  --ink:#1F2A37; --ink2:#5B6577; --lineS:#D9E1EA; --sh:0 8px 22px rgba(31,42,55,.10);
  --pri:#2B7A6B; --priD:#1F6558; --priInk:#FFFFFF;
  --acc:#F5A02B; --accD:#D98412; --accInk:#2A1A00;
  --lav:#D6CCFA; --lavInk:#3B2F78; --sky:#CFE3FF; --skyInk:#1F4E8C;
  --warn:#FFF4D6; --focus:#3E7BFF; --c-people:#FF8FA8;
  --font-b:'Nunito','Rubik',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A20; --bg2:#1A1730; --card:#1D2832; --soft:#273441;
    --ink:#EAF0F6; --ink2:#9FB0C3; --lineS:#33424F; --sh:0 8px 22px rgba(0,0,0,.35);
    --pri:#4FB8A2; --priD:#7DD3C0; --priInk:#0B1F1A;
    --acc:#F5B04A; --accD:#FFD08A; --accInk:#2A1A00;
    --lav:#3B3470; --lavInk:#E2DCFF; --sky:#1F3B63; --skyInk:#CFE3FF;
    --warn:#3B3216; --focus:#8FB0FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A20; --bg2:#1A1730; --card:#1D2832; --soft:#273441;
  --ink:#EAF0F6; --ink2:#9FB0C3; --lineS:#33424F; --sh:0 8px 22px rgba(0,0,0,.35);
  --pri:#4FB8A2; --priD:#7DD3C0; --priInk:#0B1F1A;
  --acc:#F5B04A; --accD:#FFD08A; --accInk:#2A1A00;
  --lav:#3B3470; --lavInk:#E2DCFF; --sky:#1F3B63; --skyInk:#CFE3FF;
  --warn:#3B3216; --focus:#8FB0FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--bg);
  background-image:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--font-b); font-size:16px; line-height:1.45; font-weight:600;
  padding-block:10px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100%;
}
a{color:inherit;text-decoration:none}
button,select{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1640px;margin:0 auto}
h1,h2,h3{font-family:var(--font-b);font-weight:900;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
svg.i{width:20px;height:20px;flex:none}

/* top bar */
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:50px;height:50px;flex:none;display:block}
.bt{display:grid;line-height:1.1;min-width:0}
.bn{font-weight:900;font-size:clamp(20px,3.6vw,28px);color:var(--pri)}
.bs{font-size:12px;font-weight:800;color:var(--ink2)}
.tbtns{margin-left:auto;display:flex;gap:8px}
.tb{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--lineS);border-radius:14px;padding:8px 12px;min-height:42px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 2px 0 var(--lineS)}
.tb b{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--acc);color:var(--accInk);font-size:12px}
@media(max-width:620px){.tb span.l{display:none}.bs{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:800 15px/1.15 var(--font-b);padding:10px 16px;border:2px solid var(--lineS);border-radius:14px;background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--lineS);cursor:pointer;transition:transform .08s,box-shadow .08s;min-height:46px}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--lineS)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--pri);color:var(--priInk);border-color:var(--priD);box-shadow:0 3px 0 var(--priD)}
.btn.acc{background:var(--acc);color:var(--accInk);border-color:var(--accD);box-shadow:0 3px 0 var(--accD)}
.btn.lav{background:var(--lav);color:var(--lavInk);border-color:transparent;box-shadow:0 3px 0 rgba(59,47,120,.25)}
.btn.sky{background:var(--sky);color:var(--skyInk);border-color:transparent;box-shadow:0 3px 0 rgba(31,78,140,.25)}
.btn.big{min-height:54px;padding:12px 22px;font-size:17px}
.btn.sm{padding:6px 12px;min-height:38px;font-size:14px}
select{font:800 14px var(--font-b);padding:8px 10px;border-radius:12px;border:2px solid var(--lineS);background:var(--card);min-height:40px;max-width:100%}
.sel{display:grid;gap:2px;font-size:11px;font-weight:800;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
.sel select{text-transform:none;letter-spacing:0;color:var(--ink)}

/* splash */
#splash{position:fixed;inset:0;z-index:80;background-color:var(--bg);background-image:linear-gradient(135deg,var(--bg),var(--bg2));display:grid;place-items:center;text-align:center;padding:24px;transition:opacity .5s}
#splash[hidden]{display:none}
#splash.out{opacity:0;pointer-events:none}
.sp-in{display:grid;gap:14px;justify-items:center;max-width:420px}
.sp-in img{width:min(62vw,300px);aspect-ratio:1;height:auto;animation:pop .8s cubic-bezier(.2,1.4,.4,1) backwards}
.sp-in h2{font-size:clamp(22px,5vw,30px);color:var(--pri)}
.sp-in p{color:var(--ink2);font-weight:800}
@keyframes pop{0%{transform:scale(.6) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}

/* picker */
.pk-head{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:4px 0 14px}
.pk-head h1{font-size:clamp(28px,5.2vw,48px)}
.modebox{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:20px;padding:8px;box-shadow:var(--sh)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.segb{border:0;border-radius:14px;padding:8px 14px;background:var(--soft);cursor:pointer;display:grid;text-align:left;gap:1px;min-height:46px}
.segb b{font-size:15px;font-weight:900}
.segb small{font-size:11px;font-weight:700;opacity:.8}
.segb[aria-pressed="true"]{background:var(--pri);color:var(--priInk)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:8px 18px;min-height:42px;border:0;border-radius:999px;background:var(--card);box-shadow:0 2px 6px rgba(31,42,55,.08);font-weight:800;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--priInk)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding-bottom:12px}
.card{position:relative;display:grid;gap:8px;padding:10px;border:3px solid transparent;border-radius:22px;background:var(--card);box-shadow:var(--sh);cursor:pointer;text-align:left;min-width:0;transition:transform .1s}
.card:active{transform:scale(.97)}
.card[aria-pressed="true"]{border-color:var(--pri)}
.card .tile{display:grid;place-items:center;aspect-ratio:1/.92;border-radius:16px;background:var(--t)}
.card .tile svg{width:82%;height:82%}
.card .cl{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;column-gap:6px;padding:0 4px 2px}
.card .cl b{font-size:16px;font-weight:900}
.card .cl small{font-size:12px;font-weight:800;color:var(--ink2);white-space:nowrap}
.card .chk{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;background:var(--pri);color:var(--priInk);display:none;place-items:center}
.card .chk svg{width:16px;height:16px}
.card[aria-pressed="true"] .chk{display:grid}
.startbar{position:sticky;bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:5;margin-top:8px}
.sb-in{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--card);border-radius:22px;padding:10px 14px;box-shadow:0 10px 30px rgba(31,42,55,.18)}
.seg2{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:16px}
.seg2b{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:8px 14px;min-height:42px;font-weight:800;font-size:14px;background:transparent;cursor:pointer}
.seg2b[aria-pressed="true"]{background:var(--pri);color:var(--priInk)}
.selbox{display:flex;gap:8px;align-items:baseline;font-weight:800;color:var(--ink2);font-size:14px}
.selbox b{color:var(--ink);font-size:18px;font-weight:900}

/* draw screen */
.dbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.dbar .dt{font-size:clamp(20px,3vw,28px)}
.dbar .seg2{margin-left:auto}
.panes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media(max-width:880px){.panes{grid-template-columns:minmax(0,1fr)}}
.panes[data-w="note"]{grid-template-columns:minmax(0,860px);justify-content:center}
.panes[data-w="note"] #paper{display:none}
.pane{background:var(--card);border-radius:26px;padding:14px;box-shadow:var(--sh);display:grid;gap:12px;align-content:start;min-width:0}
.ph{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.ph h2{font-size:18px;font-weight:900}
.ph .pill{margin-left:auto}
.pill{background:var(--soft);border-radius:999px;padding:3px 12px;font-weight:900;font-size:14px}
.ck{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--ink2);cursor:pointer;min-height:36px}
.ck input{width:18px;height:18px;accent-color:var(--pri)}
.sq{width:min(100%,calc(100vh - 330px));min-width:min(100%,280px);aspect-ratio:1;margin:0 auto}
.gbox{background:#fff;border-radius:18px;border:2px solid var(--lineS);display:grid;place-items:center}
.gbox svg{width:94%;height:94%}
.capcard{background:var(--warn);border-radius:18px;padding:12px 16px;display:grid;gap:2px}
.capcard b{font-size:18px;font-weight:900}
.capcard p{color:var(--ink2);font-weight:700;font-size:16px}
.ptb{margin-left:auto;display:flex;gap:6px}
.ib{width:42px;height:42px;border-radius:13px;border:2px solid var(--lineS);background:var(--card);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.ib svg{width:22px;height:22px}
.ib[aria-pressed="true"]{background:var(--pri);color:var(--priInk);border-color:var(--priD)}
.ib.arm{background:#FF5A4F;color:#fff;border-color:#D93A30}
.cwrap{position:relative;background:#fff;border-radius:18px;border:2px solid var(--lineS);overflow:hidden;touch-action:none}
.cwrap.grid{background-image:linear-gradient(rgba(62,123,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(62,123,255,.18) 1px,transparent 1px);background-size:10% 10%}
.cwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#lc{cursor:crosshair}
.ovl{position:absolute;inset:0;pointer-events:none}
.ovl svg{width:100%;height:100%}
.ptools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.18);cursor:pointer;padding:0;flex:none}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ink)}
.bbar{position:sticky;bottom:max(6px,env(safe-area-inset-bottom,0px));z-index:5;margin-top:14px;background:var(--card);border-radius:22px;padding:10px 14px;box-shadow:0 10px 30px rgba(31,42,55,.18);display:grid;gap:8px}
.bb-in{display:flex;gap:10px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.cnt2{font-weight:900;font-size:14px;color:var(--ink2);align-self:center;white-space:nowrap}
.prog{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .2s linear}
.prog[hidden]{display:none}
@media(max-width:620px){
  .bb-in{display:grid;grid-template-columns:1.1fr 1fr 1.2fr 1.2fr;gap:6px;align-items:stretch}
  .bb-in .btn{padding:6px 6px;min-height:44px;font-size:12.5px;line-height:1.1;text-align:center;white-space:normal;gap:4px}
  .bb-in .btn svg.i{width:16px;height:16px}
  .bb-in #pause{grid-column:1/2;grid-row:2}
  .bb-in #primary{grid-column:2/-1;grid-row:2;font-size:15px;min-height:48px}
  .bb-in>*{min-width:0}
  .bb-in select{width:100%}
  .bb-in .cnt2{display:none}
  .bb-in .sel{align-self:center}
  .bbar{padding:8px 10px;border-radius:18px}
  .sb-in{padding:8px 10px;gap:8px}
  .seg2b{padding:6px 10px;font-size:13px}
  .selbox{width:100%;justify-content:center}
  .sb-in .btn.big{width:100%}
}

/* drawings: per-step fill; .lines = outline-only guide */
.gsvg *{stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.gsvg g{color:#1E2547}
.gsvg g.cur{color:#E8432F}
.gsvg circle,.gsvg ellipse,.gsvg rect,.gsvg polygon,.gsvg path.s{fill:var(--fill,#fff)}
.gsvg path{fill:none}
.gsvg .h{fill:#D8DDF0}
.gsvg .f{fill:currentColor}
.gsvg.lines g{--fill:#fff!important}
.gsvg.lines .h{fill:#fff}
.gsvg .start{fill:#E8432F;stroke:#fff;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.8)}50%{transform:scale(1.5)}}
.card .tile .gsvg *{stroke-width:6}
.ovl .gsvg.ghost :not(.f){fill:none}
.ovl .gsvg.ghost g{color:#7E8BC9}
.ovl .gsvg.ghost *{stroke-width:5;opacity:.5}
.ovl .gsvg.dots *{fill:none;stroke:#3E7BFF;stroke-width:5;stroke-dasharray:.014 .022;opacity:.9}
.cur>*{animation:draw var(--dur,1.2s) ease backwards}
@keyframes draw{0%{stroke-dasharray:1;stroke-dashoffset:1;fill-opacity:0;opacity:.2}10%{opacity:1}60%{fill-opacity:0}100%{stroke-dasharray:1;stroke-dashoffset:0;fill-opacity:1}}

/* shared: gallery, animate */
.trow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-h{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-h h1{font-size:clamp(26px,5vw,40px)}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--lav);color:var(--lavInk);font-weight:900;font-size:14px}
.stage{display:block;width:100%;aspect-ratio:8/5;border-radius:24px;box-shadow:var(--sh);background:#8ECFFF;cursor:pointer;touch-action:manipulation}
.ctrl{display:grid;gap:14px;margin-top:18px}
.ctrl h3{font:900 13px var(--font-b);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
.pchip{padding:8px 16px;min-height:42px;border:0;border-radius:999px;background:var(--card);box-shadow:0 2px 6px rgba(31,42,55,.10);font-weight:800;font-size:15px;cursor:pointer}
.pchip[aria-pressed="true"]{background:var(--pri);color:var(--priInk)}
.hint{color:var(--ink2);font-weight:700;font-size:14px;margin-top:10px}
.gal-grid{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:700px){.gal-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:960px){.gal-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.gcard{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:10px;display:grid;gap:8px;min-width:0}
.gcard button.gimg{padding:0;background:#fff;border-radius:14px;aspect-ratio:1;display:grid;place-items:center;cursor:pointer;border:2px solid var(--lineS)}
.gcard img{width:100%;height:100%;object-fit:contain;display:block}
.gcard .nm{font-weight:900}
.gcard .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{background:var(--card);border:3px dashed var(--lineS);border-radius:22px;padding:34px 20px;text-align:center;display:grid;gap:14px;justify-items:center}
.empty p{max-width:40ch;color:var(--ink2);font-weight:700}
#ov{position:fixed;inset:0;z-index:50;background:rgba(10,14,40,.72);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#ov[hidden]{display:none}
.ov-card{background:var(--card);border-radius:22px;padding:14px;max-width:min(520px,100%);width:100%;display:grid;gap:12px}
.ov-card img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:14px;border:2px solid var(--lineS)}
.ov-card p{color:var(--ink2);font-weight:700;font-size:14px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:800;z-index:90;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<style id="fun">

}

  :root:not([data-theme="light"]){

(function(){
  const sp=$('#splash');let seen=false;
  try{seen=sessionStorage.getItem('bz.splash')==='1';}catch(e){}
  if(seen){sp.hidden=true;return;}
  const close=()=>{try{sessionStorage.setItem('bz.splash','1');}catch(e){}sp.classList.add('out');setTimeout(()=>{sp.hidden=true;},550);};
  $('#spgo').onclick=close;
  setTimeout(()=>{if(!sp.hidden&&!sp.classList.contains('out'))close();},4200);
})();

/* ---------- shape helpers ---------- */
const at=k=>k?' class="'+k+'"':'';
const E=(x,y,a,b,k)=>'<ellipse'+at(k)+' cx="'+x+'" cy="'+y+'" rx="'+a+'" ry="'+b+'"/>';
const C=(x,y,r,k)=>'<circle'+at(k)+' cx="'+x+'" cy="'+y+'" r="'+r+'"/>';
const R=(x,y,w,h,r,k)=>'<rect'+at(k)+' x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(r||0)+'"/>';
const P=(d,k)=>'<path'+at(k)+' d="'+d+'"/>';
const Wh=(x,y,r,r2)=>C(x,y,r)+C(x,y,r2,'h');
function scallop(cx,cy,rx,ry,n){
  const pts=[];for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;pts.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)]);}
  let ch=0;for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];ch+=Math.hypot(q[0]-p[0],q[1]-p[1]);}
  const r=(ch/n/2*1.08).toFixed(1);
  let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=1;i<=n;i++){const q=pts[i%n];d+='A'+r+' '+r+' 0 0 1 '+q[0].toFixed(1)+' '+q[1].toFixed(1);}
  return d+'Z';
}

function svgOf(d,k,hl,cls){
  const n=d.steps.length, lim=k>0?k:n;
  let h='<svg class="gsvg '+(cls||'')+'" viewBox="0 0 200 200" role="img" aria-label="'+d.name+'">';
  for(let i=0;i<lim;i++){
    const f=PAL[d.col[i]];
    h+='<g class="'+(hl&&i===lim-1?'cur':'old')+'"'+(f?' style="--fill:'+f+'"':'')+'>'+d.steps[i][1]+'</g>';
  }
  return h+'</svg>';
}

/* ---------- gallery storage ---------- */
const KEY='bz.gallery.v1';
let G=[];
try{G=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(G))G=[];}catch(e){G=[];}
function persist(){
  for(let tries=0;tries<20;tries++){
    try{localStorage.setItem(KEY,JSON.stringify(G));return true;}catch(e){ if(G.length<=1)return false; G.pop(); }
  }
  return false;
}
function updCount(){$('#gcount').textContent=G.length;}
function saveArt(src,name,from){
  G.unshift({id:'g'+Date.now().toString(36),name,from,src,t:Date.now()});
  if(G.length>14)G.length=14;
  persist();updCount();
}

  };
  const syncMode=()=>{
    $$('.segb').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===S.mode)));

  S.cleanup.push(()=>clearTimeout(rt));

  $('#prev').onclick=()=>show(step-1);
  $('#again').onclick=()=>{stopReplay();elapsed=0;renderGuide(step,true);setCaption(step);};
  $('#restart').onclick=()=>startReplay();
  $('#pause').onclick=()=>{
    paused=!paused;
    $('#pause').setAttribute('aria-pressed',String(paused));
    $('#pause').innerHTML=ic(paused?'play':'pause')+' <span id="pauseL">'+(paused?'Үргэлжлүүл':'Түр зогсоох')+'</span>';
  };
  $('#primary').onclick=()=>{
    if(step<n){show(step+1);return;}
    if(board())animate();else location.hash='#home';
  };
  $('#colv').onchange=()=>{renderGuide(step,false);};
  $('#speed').value=S.speed;
  $('#speed').onchange=e=>{S.speed=e.target.value;};
  $('#toList').onclick=()=>{location.hash='#home';};
  $$('.seg2b').forEach(b=>b.onclick=()=>{S.where=b.dataset.w;updateBar();});

  /* auto mode: advance by itself every N seconds */
  const iv=setInterval(()=>{
    if(S.mode!=='auto'||paused||replaying)return;
    if(step>=n){$('#prog').style.width='100%';return;}
    elapsed+=0.2;
    $('#prog').style.width=Math.min(100,elapsed/S.gap*100)+'%';
    $('#cnt2').textContent='Алхам '+step+' / '+n+' · '+Math.max(0,Math.ceil(S.gap-elapsed))+' сек';
    if(elapsed>=S.gap)show(step+1);
  },200);
  S.cleanup.push(()=>clearInterval(iv));

  /* ----- paper: line layer on top, fill layer underneath ----- */
  const N=600,lc=$('#lc'),fc=$('#fc'),cwrap=$('#cwrap');
  lc.width=lc.height=fc.width=fc.height=N;
  const lx=lc.getContext('2d',{willReadFrequently:true}),fx=fc.getContext('2d',{willReadFrequently:true});
  [lx,fx].forEach(c=>{c.lineCap='round';c.lineJoin='round';});
  const undo=[],redo=[];let dirty=false;
  const cur=()=>({l:lx.getImageData(0,0,N,N),f:fx.getImageData(0,0,N,N)});
  const put2=s=>{lx.putImageData(s.l,0,0);fx.putImageData(s.f,0,0);};
  const snap=()=>{undo.push(cur());if(undo.length>20)undo.shift();redo.length=0;dirty=true;syncUR();};
  const syncUR=()=>{$('#bUndo').disabled=!undo.length;$('#bRedo').disabled=!redo.length;};
  const blank=()=>{lx.clearRect(0,0,N,N);fx.clearRect(0,0,N,N);};
  const saveDraft=()=>{if(dirty)S.drafts[d.id]={l:lc.toDataURL(),f:fc.toDataURL()};};
  S.cleanup.push(saveDraft);
  const dr=S.drafts[d.id];
  if(dr){[[dr.l,lx],[dr.f,fx]].forEach(([u,c])=>{const im=new Image();im.onload=()=>c.drawImage(im,0,0,N,N);im.src=u;});dirty=true;}

  const widthOf=()=>{const b=[5,10,18][S.tool.size];return S.tool.mode==='eraser'?b*2.6:b;};
  const targets=()=>S.tool.mode==='eraser'?[lx,fx]:[lx];
  const prep=()=>{targets().forEach(c=>{c.globalCompositeOperation=S.tool.mode==='eraser'?'destination-out':'source-over';c.strokeStyle=c.fillStyle=S.tool.color;c.lineWidth=widthOf();});};
  const pos=e=>{const r=lc.getBoundingClientRect();return{x:(e.clientX-r.left)*N/r.width,y:(e.clientY-r.top)*N/r.height};};
  const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  let drawing=false,pts=[];
  const seg=p=>{
    const a=pts[pts.length-1];pts.push(p);
    const m0=pts.length>2?mid(pts[pts.length-3],a):a,m1=mid(a,p);
    targets().forEach(c=>{c.beginPath();c.moveTo(m0.x,m0.y);c.quadraticCurveTo(a.x,a.y,m1.x,m1.y);c.stroke();});
  };
  const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  function floodFill(px,py){
    const x=Math.round(px),y=Math.round(py);
    if(x<0||y<0||x>=N||y>=N)return;
    const src=lx.getImageData(0,0,N,N).data;
    const wall0=new Uint8Array(N*N),tmp=new Uint8Array(N*N),wall=new Uint8Array(N*N);
    for(let i=0;i<N*N;i++)wall0[i]=src[i*4+3]>90?1:0;
    const onLine=()=>toast('Зураасан дээр биш, зургийн дотор дарж будаарай');
    if(wall0[y*N+x]){onLine();return;}
    /* thicken walls by 2px so tiny gaps in a child's outline do not leak */
    for(let yy=0;yy<N;yy++)for(let xx=0;xx<N;xx++){if(wall0[yy*N+xx]){for(let k=-2;k<=2;k++){const nx=xx+k;if(nx>=0&&nx<N)tmp[yy*N+nx]=1;}}}
    for(let yy=0;yy<N;yy++)for(let xx=0;xx<N;xx++){if(tmp[yy*N+xx]){for(let k=-2;k<=2;k++){const ny=yy+k;if(ny>=0&&ny<N)wall[ny*N+xx]=1;}}}
    if(wall[y*N+x]){onLine();return;}
    const reg=new Uint8Array(N*N),stack=[x,y];
    while(stack.length){
      const cy=stack.pop(),cx=stack.pop();
      if(wall[cy*N+cx]||reg[cy*N+cx])continue;
      let l=cx;while(l>0&&!wall[cy*N+l-1]&&!reg[cy*N+l-1])l--;
      let r=cx;while(r<N-1&&!wall[cy*N+r+1]&&!reg[cy*N+r+1])r++;
      for(let xx=l;xx<=r;xx++)reg[cy*N+xx]=1;
      [cy-1,cy+1].forEach(yy=>{
        if(yy<0||yy>=N)return;
        let inS=false;
        for(let xx=l;xx<=r;xx++){const o=yy*N+xx,ok=!wall[o]&&!reg[o];if(ok&&!inS){stack.push(xx,yy);inS=true;}else if(!ok)inS=false;}
      });
    }
    for(let i=0;i<N;i++){if(reg[i]||reg[(N-1)*N+i]||reg[i*N]||reg[i*N+N-1]){toast('Зураас хаагдаагүй байна. Зураасаа холбоод дахин будаарай');return;}}
    snap();
    const fd=fx.getImageData(0,0,N,N),px2=fd.data,[cr,cg,cb]=hex(S.tool.color);
    const put=i=>{px2[i*4]=cr;px2[i*4+1]=cg;px2[i*4+2]=cb;px2[i*4+3]=255;};
    for(let i=0;i<N*N;i++){
      if(!reg[i])continue;put(i);
      const xx=i%N,yy=(i-xx)/N;
      for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
        const nx=xx+dx,ny=yy+dy;if(nx<0||ny<0||nx>=N||ny>=N)continue;
        put(ny*N+nx);
      }
    }
    fx.putImageData(fd,0,0);
  }
  lc.addEventListener('pointerdown',e=>{
    if(e.button>0)return;e.preventDefault();
    const p=pos(e);
    if(S.tool.mode==='fill'){floodFill(p.x,p.y);return;}
    try{lc.setPointerCapture(e.pointerId);}catch(_){}
    snap();prep();drawing=true;pts=[p];
    targets().forEach(c=>{c.beginPath();c.arc(p.x,p.y,c.lineWidth/2,0,Math.PI*2);c.fill();});
  });
  lc.addEventListener('pointermove',e=>{
    if(!drawing)return;
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    (evs.length?evs:[e]).forEach(ev=>seg(pos(ev)));
  });
  const end=()=>{drawing=false;[lx,fx].forEach(c=>{c.globalCompositeOperation='source-over';});};
  lc.addEventListener('pointerup',()=>{
    if(drawing&&pts.length>1){const a=pts[pts.length-1],m=mid(pts[pts.length-2],a);targets().forEach(c=>{c.beginPath();c.moveTo(m.x,m.y);c.lineTo(a.x,a.y);c.stroke();});}
    end();
  });
  lc.addEventListener('pointercancel',end);
  lc.addEventListener('pointerleave',()=>{if(drawing)end();});

  /* ----- tools ----- */
  const syncTools=()=>{
    $$('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tool===S.tool.mode)));
    $$('.sw').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.c===S.tool.color&&S.tool.mode!=='eraser')));
    lc.style.cursor=S.tool.mode==='fill'?'cell':'crosshair';
  };
  $$('[data-tool]').forEach(b=>b.onclick=()=>{S.tool.mode=b.dataset.tool;syncTools();});
  $$('.sw').forEach(b=>b.onclick=()=>{S.tool.color=b.dataset.c;if(S.tool.mode==='eraser')S.tool.mode='pencil';syncTools();});
  $('#size').value=String(S.tool.size);
  $('#size').onchange=e=>{S.tool.size=+e.target.value;};
  syncTools();syncUR();
  $('#bUndo').onclick=()=>{const u=undo.pop();if(!u)return;redo.push(cur());put2(u);syncUR();};
  $('#bRedo').onclick=()=>{const r=redo.pop();if(!r)return;undo.push(cur());put2(r);syncUR();};
  let clr=0;
  $('#bClear').onclick=e=>{
    const b=e.currentTarget;
    if(!clr){b.classList.add('arm');toast('Цэвэрлэхийн тулд дахин дарна уу');clr=setTimeout(()=>{clr=0;b.classList.remove('arm');},2500);return;}
    clearTimeout(clr);clr=0;b.classList.remove('arm');snap();blank();
  };
  S.cleanup.push(()=>clearTimeout(clr));
  $('#bGrid').onclick=e=>{S.grid=!S.grid;cwrap.classList.toggle('grid',S.grid);e.currentTarget.setAttribute('aria-pressed',String(S.grid));};
  cwrap.classList.toggle('grid',S.grid);$('#bGrid').setAttribute('aria-pressed',String(S.grid));

  /* help overlay: faint model or dotted outline of the current step */
  const dotsSvg=k=>'<svg class="gsvg dots" viewBox="0 0 200 200" aria-hidden="true"><g>'+d.steps[k-1][1]+'</g></svg>';
  function updateOverlay(){
    const hv=$('#hv');if(!hv)return;
    if(S.help==='ghost')hv.innerHTML=svgOf(d,step,false,'ghost');
    else if(S.help==='dots')hv.innerHTML=dotsSvg(step);
    else hv.innerHTML='';
  }
  $('#help').value=S.help;
  $('#help').onchange=e=>{S.help=e.target.value;updateOverlay();};
  let hintT=0;
  $('#bHint').onclick=()=>{
    $('#hv').innerHTML=dotsSvg(step);clearTimeout(hintT);
    hintT=setTimeout(updateOverlay,3500);
  };
  S.cleanup.push(()=>clearTimeout(hintT));

  /* ----- export / actions ----- */
  const sprite=()=>{
    const t=document.createElement('canvas');t.width=t.height=N;const tc=t.getContext('2d',{willReadFrequently:true});
    tc.drawImage(fc,0,0);tc.drawImage(lc,0,0);
    const im=tc.getImageData(0,0,N,N).data;
    let x0=N,y0=N,x1=-1,y1=-1;
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(im[(y*N+x)*4+3]>12){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}
    if(x1<0)return null;
    const pad=10,w=x1-x0+1+pad*2,h=y1-y0+1+pad*2,sc=Math.min(380/w,380/h,1.25);
    const o=document.createElement('canvas');o.width=o.height=400;
    const oc=o.getContext('2d'),dw=w*sc,dh=h*sc;
    oc.drawImage(t,x0-pad,y0-pad,w,h,(400-dw)/2,(400-dh)/2,dw,dh);
    return o.toDataURL('image/png');
  };
  function animate(){
    const src=sprite();if(!src){toast('Эхлээд цаасан дээрээ зураарай');return;}
    saveDraft();
    S.art={src,name:d.name,from:d.id};S.anim.motion=d.m;S.anim.bg=d.b;
    location.hash='#animate';
  }
  $('#bSave').onclick=()=>{
    const src=sprite();if(!src){toast('Эхлээд цаасан дээрээ зураарай');return;}
    saveDraft();saveArt(src,d.name,d.id);toast('Хадгалагдлаа. «Зургууд» хэсгээс харна.');
  };

  show(1);
}

/* ---------- animation stage ---------- */
const MOTIONS=[['bounce','Үсрэх'],['float','Хөвөх'],['dance','Бүжиглэх'],['spin','Эргэх'],['run','Гүйх'],['fly','Нисэх']];
const BGS=[['sky','Тэнгэр'],['steppe','Хээр'],['sea','Далай'],['space','Сансар'],['road','Зам']];
const W=960,H=600;
const STARS=Array.from({length:70},(_,i)=>({x:(i*397%W),y:(i*211%(H*0.8)),r:1+(i%3)*.7,p:i*.9}));

function cloud(c,x,y,s){c.beginPath();[[0,0,22],[24,-8,28],[52,0,22],[26,6,24]].forEach(a=>{c.moveTo(x+a[0]*s+a[2]*s,y+a[1]*s);c.arc(x+a[0]*s,y+a[1]*s,a[2]*s,0,6.283);});c.fill();}
function hills(c,t,base,amp,col,k,sp){c.fillStyle=col;c.beginPath();c.moveTo(0,H);for(let x=0;x<=W;x+=16)c.lineTo(x,base+Math.sin(x*k+t*sp)*amp);c.lineTo(W,H);c.closePath();c.fill();}
function drawBg(c,t,bg){
  let g;
  if(bg==='sea'){
    g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#6FD3F7');g.addColorStop(1,'#1B63C9');c.fillStyle=g;c.fillRect(0,0,W,H);
    c.fillStyle='rgba(255,255,255,.10)';for(let i=0;i<4;i++){c.beginPath();c.moveTo(120+i*220,0);c.lineTo(190+i*220,0);c.lineTo(110+i*220+Math.sin(t*.5+i)*20,H);c.lineTo(20+i*220,H);c.closePath();c.fill();}
    c.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<14;i++){const x=(i*83)%W,y=H-((t*40+i*97)%H);c.beginPath();c.arc(x+Math.sin(t+i)*8,y,3+(i%3)*2,0,6.283);c.fill();}
    hills(c,t,H*0.88,10,'#F3DBA2',.01,0);
    c.strokeStyle='#2FA36B';c.lineWidth=8;c.lineCap='round';for(let i=0;i<9;i++){const x=40+i*110;c.beginPath();c.moveTo(x,H);c.quadraticCurveTo(x+Math.sin(t*1.6+i)*16,H-40,x+Math.sin(t*1.6+i+1)*22,H-80-(i%3)*18);c.stroke();}
    c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.moveTo(0,0);for(let x=0;x<=W;x+=16)c.lineTo(x,14+Math.sin(x*.02+t*2)*6);c.lineTo(W,0);c.fill();
  }else if(bg==='space'){
    g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#090D2E');g.addColorStop(1,'#33206B');c.fillStyle=g;c.fillRect(0,0,W,H);
    STARS.forEach(s=>{c.globalAlpha=.55+.45*Math.sin(t*2+s.p);c.fillStyle='#fff';c.beginPath();c.arc(s.x,s.y,s.r,0,6.283);c.fill();});c.globalAlpha=1;
    c.fillStyle='#FF9E5E';c.beginPath();c.arc(760,140,62,0,6.283);c.fill();
    c.strokeStyle='#FFE0A8';c.lineWidth=8;c.beginPath();c.ellipse(760,140,104,24,-.35,0,6.283);c.stroke();
    hills(c,t,H*0.9,6,'#7B7FA8',.012,0);
    c.fillStyle='#656994';[[140,.93,26],[420,.95,18],[700,.92,30]].forEach(a=>{c.beginPath();c.ellipse(a[0],H*a[1],a[2],a[2]*.4,0,0,6.283);c.fill();});
  }else{
    g=c.createLinearGradient(0,0,0,H);
    if(bg==='steppe'){g.addColorStop(0,'#74C3FF');g.addColorStop(1,'#E4F5FF');}
    else if(bg==='road'){g.addColorStop(0,'#8ED2FF');g.addColorStop(1,'#F4FBFF');}
    else{g.addColorStop(0,'#69BDFF');g.addColorStop(1,'#E9F7FF');}
    c.fillStyle=g;c.fillRect(0,0,W,H);
    c.fillStyle='#FFE27A';c.beginPath();c.arc(820,100,46,0,6.283);c.fill();
    c.fillStyle='rgba(255,226,122,.3)';c.beginPath();c.arc(820,100,70,0,6.283);c.fill();
    c.fillStyle='rgba(255,255,255,.95)';
    [[0,90,1.1,14],[300,150,.8,10],[560,70,1,18],[820,190,.7,8]].forEach(a=>{const x=((a[0]+t*a[3])%(W+240))-120;cloud(c,x,a[1],a[2]);});
    if(bg==='steppe'){
      hills(c,t,H*0.66,18,'#A8DC9C',.006,0);hills(c,t,H*0.78,14,'#63C174',.009,0);
      const gx=720,gy=H*0.68;c.fillStyle='#fff';c.strokeStyle='#1E2547';c.lineWidth=3;
      c.beginPath();c.rect(gx-46,gy-30,92,34);c.fill();c.stroke();
      c.beginPath();c.moveTo(gx-56,gy-28);c.lineTo(gx,gy-74);c.lineTo(gx+56,gy-28);c.quadraticCurveTo(gx,gy-18,gx-56,gy-28);c.fill();c.stroke();
      c.fillStyle='#FF8A1F';c.beginPath();c.rect(gx-9,gy-22,18,26);c.fill();c.stroke();
      c.fillStyle='#FFD21F';for(let i=0;i<16;i++){c.beginPath();c.arc((i*61+30)%W,H*0.86+(i%4)*14,3.5,0,6.283);c.fill();}
    }else if(bg==='road'){
      hills(c,t,H*0.62,16,'#B7E3A6',.007,0);
      c.fillStyle='#1E7A3D';for(let i=0;i<6;i++){const x=W-((t*70+i*210)%(W+160))+80;c.beginPath();c.moveTo(x,H*0.62-70);c.lineTo(x-26,H*0.62);c.lineTo(x+26,H*0.62);c.fill();}
      c.fillStyle='#4A5170';c.fillRect(0,H*0.72,W,H*0.28);
      c.fillStyle='#D9DDF2';c.fillRect(0,H*0.72,W,6);
      c.fillStyle='#FFE27A';for(let i=-1;i<10;i++){const x=i*120-((t*160)%120);c.fillRect(x,H*0.86,64,8);}
    }else{
      hills(c,t,H*0.8,16,'#7FD27F',.008,0);hills(c,t,H*0.9,10,'#4DB863',.011,0);
    }
  }
}
function star(c,x,y,r,rot){c.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}c.closePath();c.fill();}

    <div class="trow"><button class="btn" id="keep">Хадгалах</button><a class="btn" href="${back}">Дахин зурах</a></div>
  </div>`;
  const img=new Image();img.src=A.src;
  const cv=$('#stage'),c=cv.getContext('2d');
  const sync=()=>{
    $$('#g-m .pchip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===S.anim.motion)));
    $$('#g-b .pchip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===S.anim.bg)));
    $$('#g-n .pchip[data-n]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.n===S.anim.n)));
    $('#flip').setAttribute('aria-pressed',String(S.anim.flip));
    $('#pause').setAttribute('aria-pressed',String(S.anim.paused));
    $('#pause').textContent=S.anim.paused?'Үргэлжлүүлэх':'Зогсоох';
  };
  let chars=[],parts=[];
  const size=()=>S.anim.n===1?250:S.anim.n===3?180:140;
  const init=()=>{
    const n=S.anim.n;chars=[];
    for(let i=0;i<n;i++){
      const ox=W*(i+1)/(n+1)-W/2, oy=(n===1?0:(i%2?-0.12:0.04))*H;
      chars.push({ph:i*1.7,ox,oy,x:W/2+ox,y:H*0.58+oy,tx:W/2+ox,ty:H*0.58+oy});
    }
  };
  init();
  $('#g-m').onclick=e=>{const b=e.target.closest('.pchip');if(!b)return;S.anim.motion=b.dataset.v;sync();};
  $('#g-b').onclick=e=>{const b=e.target.closest('.pchip');if(!b)return;S.anim.bg=b.dataset.v;sync();};
  $('#g-n').onclick=e=>{const b=e.target.closest('.pchip[data-n]');if(!b)return;S.anim.n=+b.dataset.n;init();sync();};
  $('#flip').onclick=()=>{S.anim.flip=!S.anim.flip;sync();};
  $('#pause').onclick=()=>{S.anim.paused=!S.anim.paused;sync();};
  $('#keep').onclick=()=>{saveArt(A.src,A.name,A.from);toast('Хадгалагдлаа');};
  cv.addEventListener('pointerdown',e=>{
    const r=cv.getBoundingClientRect();
    const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
    chars.forEach(ch=>{ch.tx=Math.min(W-60,Math.max(60,x+ch.ox*.6));ch.ty=Math.min(H*0.82,Math.max(H*0.3,y+ch.oy));});
    const cols=['#FFD21F','#FF7AB6','#4A8CFF','#3CC46E','#FF8A1F'];
    for(let i=0;i<12;i++){const a=Math.random()*6.283,v=120+Math.random()*180;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,life:1,r:7+Math.random()*7,c:cols[i%5],rot:Math.random()*3});}
  });
  sync();
  let t=0,last=performance.now(),raf=0,alive=true;
  const frame=now=>{
    if(!alive)return;
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(!S.anim.paused)t+=dt;
    const m=S.anim.motion,sz=size(),face=S.anim.flip?-1:1;
    drawBg(c,t,S.anim.bg);
    const dtm=S.anim.paused?0:dt;
    chars.forEach(ch=>{
      const k=Math.min(1,dtm*4);
      if(m==='run'||m==='fly'){
        ch.x+=face*(m==='run'?230:150)*dtm;
        if(face>0&&ch.x>W+sz)ch.x=-sz;
        if(face<0&&ch.x<-sz)ch.x=W+sz;
        ch.y+=(ch.ty-ch.y)*k;
        if(m==='fly'&&Math.abs(ch.ty-H*0.58-ch.oy)<1)ch.ty=H*0.4+ch.oy;
      }else{ch.x+=(ch.tx-ch.x)*k;ch.y+=(ch.ty-ch.y)*k;}
      const tt=t+ch.ph;let dx=0,dy=0,rot=0,sx=1,sy=1,lift=0;
      if(m==='bounce'){const s=Math.abs(Math.sin(tt*3.4));dy=-s*100;lift=s;sx=1+.16*(1-s);sy=1-.16*(1-s);}
      else if(m==='float'){dy=Math.sin(tt*1.8)*22-30;dx=Math.cos(tt*1.2)*18;rot=Math.sin(tt*1.4)*.07;lift=.5;}
      else if(m==='dance'){const s=Math.sin(tt*7);rot=s*.28;dy=-Math.abs(s)*22;lift=Math.abs(s)*.2;sx=1+Math.sin(tt*14)*.07;sy=1-Math.sin(tt*14)*.07;}
      else if(m==='spin'){rot=tt*3.2;dy=Math.sin(tt*2)*16-20;lift=.4;}
      else if(m==='run'){dy=-Math.abs(Math.sin(tt*9))*18;rot=Math.sin(tt*9)*.08;lift=Math.abs(Math.sin(tt*9))*.3;}
      else if(m==='fly'){dy=Math.sin(tt*2.6)*34-40;rot=Math.sin(tt*2.6)*.14;sx=1+Math.sin(tt*16)*.04;lift=.8;}
      const gy=ch.y+sz*.46;
      c.fillStyle='rgba(20,30,70,'+(.22-lift*.12).toFixed(3)+')';
      c.beginPath();c.ellipse(ch.x+dx,gy,sz*.34*(1-lift*.35),sz*.07*(1-lift*.35),0,0,6.283);c.fill();
      c.save();c.translate(ch.x+dx,ch.y+dy);c.rotate(rot);
      const fl=(m==='run'||m==='fly')?face:(S.anim.flip?-1:1);
      c.scale(sx*fl,sy);
      if(img.complete&&img.naturalWidth)c.drawImage(img,-sz/2,-sz/2,sz,sz);
      c.restore();
    });
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=520*dt;p.life-=dt*1.1;p.rot+=dt*5;
      if(p.life<=0){parts.splice(i,1);continue;}
      c.globalAlpha=Math.max(0,p.life);c.fillStyle=p.c;star(c,p.x,p.y,p.r,p.rot);c.globalAlpha=1;
    }
    raf=requestAnimationFrame(frame);
  };
  raf=requestAnimationFrame(frame);
  S.cleanup.push(()=>{alive=false;cancelAnimationFrame(raf);});
}

function snake(A,B,n,r0,r1,step,over){
  const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
  const a=[A[0]-ux*over,A[1]-uy*over],b=[B[0]+ux*over,B[1]+uy*over];
  let d='';
  for(let k=r0;k<r1;k++){
    const o=k*step+step/2;
    const p=[a[0]+n[0]*o,a[1]+n[1]*o],q=[b[0]+n[0]*o,b[1]+n[1]*o];
    const s=k%2?q:p,e=k%2?p:q;
    d+=(k===r0?'M':'L')+s[0].toFixed(1)+' '+s[1].toFixed(1)+'L'+e[0].toFixed(1)+' '+e[1].toFixed(1);
  }
  return d;
}
function spiral(cx,cy,R,step,t0,t1){
  let d='';
  for(let t=t0;t<=t1;t+=0.12){
    const r=Math.max(1,R-step*t/(2*Math.PI)),a=-Math.PI/2+t;
    d+=(t===t0?'M':'L')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1);
  }
  return d;
}

function playShape(svg){

    const head=svg.querySelector('.head');
    segs.forEach(([p])=>{p._l=p.getTotalLength();p.style.strokeDasharray=p._l;p.style.strokeDashoffset=p._l;});
    if(reduce){segs.forEach(([p])=>{p.style.strokeDashoffset=0;});return res();}
    head.style.opacity=1;
    let i=0,t0=0;
    const step=now=>{
      if(svg._tok!==tok||!svg.isConnected){return res();}
      if(!t0)t0=now;
      const sg=segs[i],p=sg[0],k=Math.min(1,(now-t0)/sg[1]);
      p.style.strokeDashoffset=p._l*(1-k);

      head.setAttribute('cx',pt.x);head.setAttribute('cy',pt.y);
      if(k>=1){i++;t0=0;if(i>=segs.length){head.style.opacity=0;return res();}}
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

      <g stroke="#1E2547" stroke-width="4" stroke-linejoin="round">${s.outline}</g>
      <path d="${s.arrow}" fill="none" stroke="#2FB36B" stroke-width="6" stroke-linecap="round" stroke-opacity=".8" marker-end="url(#pah)"/></svg></div>
    <div class="trow" id="psw">${PCOL.map((c,i)=>`<button class="sw" style="background:${c}" aria-label="Өнгө ${i+1}" aria-pressed="${c===s.col}" data-c="${c}"></button>`).join('')}</div>
    <div class="trow"><button class="btn sm" id="pclr">Арилгах</button><button class="btn pri" id="pdone">Дууслаа</button></div></div>`;
  ov.hidden=false;
  const cv=$('canvas',ov),ctx=cv.getContext('2d');let col=s.col,down=false,last=null;
  const clip=new Path2D(PD[s.id]);
  const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*200,(e.clientY-r.top)/r.height*170];};
  const seg=(a,b)=>{ctx.save();ctx.scale(2,2);ctx.clip(clip);ctx.strokeStyle=col;ctx.globalAlpha=.9;ctx.lineWidth=8.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.restore();};
  cv.onpointerdown=e=>{down=true;last=pos(e);seg(last,last);try{cv.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();};
  cv.onpointermove=e=>{if(!down)return;const p=pos(e);seg(last,p);last=p;};
  cv.onpointerup=cv.onpointercancel=()=>{down=false;};
  $('#psw').onclick=e=>{const b=e.target.closest('.sw');if(!b)return;col=b.dataset.c;$$('#psw .sw').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};
  $('#pclr').onclick=()=>ctx.clearRect(0,0,400,340);
  const close=()=>{ov.hidden=true;};
  $('#pdone').onclick=close;ov.onclick=e=>{if(e.target===ov)close();};
}
function viewColor(){
  const shapes=colorShapes();
  app.innerHTML=`
  <div class="crumb"><a class="btn sm" href="#home">← Нүүр</a></div>
  <div class="clr-h page-h" style="margin-bottom:6px"><h1>Зөв будъя</h1><span class="badge">Будах заавар</span></div>
  <p class="clr-sub">Дүрс бүрийг нэг чиглэлд, зураасны дотор тууштай буд. Ногоон сум чиглэлийг заана. Дүрс дээр дарвал будалт хөдөлж үзүүлнэ.</p>
  <h2 class="sec-t">Хэлбэр бүрийг ингэж буд <button class="btn sm pri" id="clrAll">▶ Бүгдийг үзүүлэх</button></h2>
  <div class="clr-grid">${shapes.map(s=>`
    <div class="ccard" data-id="${s.id}">
      <div class="cbox" data-play="${s.id}">${shapeSvg(s)}</div>
      <h3><span class="dot" style="background:${s.col}"></span>${s.name} · ${s.cn}</h3>
      <p class="dir">${s.txt}</p>
      <div class="row2"><button class="btn sm pri" data-play="${s.id}">▶ Үзүүлэх</button><button class="btn sm acc" data-try="${s.id}">✏ Би буръя</button></div>
    </div>`).join('')}</div>
  <div class="tips" style="margin-top:16px"><b>Будахдаа санаарай</b><ul>
    <li>Нэг чиглэлд, нэг мөрийн ард нэг мөр буд.</li>
    <li>Зураасны гадаа гаргахгүй, завсар үлдээхгүй.</li>
    <li>Эхлээд хөнгөн, дараа нь хүчтэй дарж буд.</li></ul></div>
  <h2 class="sec-t">Зургаа 3 алхамтай буд</h2>
  <div class="stp-grid">
    <div class="stp" data-k="mouse"><div class="cbox">${mouseSvg()}</div><div class="cap"></div>
      <div class="trow"><button class="pchip" data-st="1" aria-pressed="true">1</button><button class="pchip" data-st="2" aria-pressed="false">2</button><button class="pchip" data-st="3" aria-pressed="false">3</button><button class="btn sm pri" data-auto="1">▶ Автомат</button></div></div>
    <div class="stp" data-k="car"><div class="cbox">${carSvg()}</div><div class="cap"></div>
      <div class="trow"><button class="pchip" data-st="1" aria-pressed="true">1</button><button class="pchip" data-st="2" aria-pressed="false">2</button><button class="pchip" data-st="3" aria-pressed="false">3</button><button class="btn sm pri" data-auto="1">▶ Автомат</button></div></div>
  </div>`;
  /* хэлбэрүүд: эхэнд нь хүрээ нь буулттай, дотор нь хоосон */
  const svgOf=id=>$('.ccard[data-id="'+id+'"] svg');
  $$('.ccard svg').forEach(sv=>{
    const bd=sv.querySelector('.bd'),fl=sv.querySelector('.fl');
    [bd,fl].forEach(p=>{p._l=p.getTotalLength();p.style.strokeDasharray=p._l;});
    bd.style.strokeDashoffset=0;fl.style.strokeDashoffset=fl._l;
  });
  let allTok=0;
  S.cleanup.push(()=>{allTok++;$$('.ccard svg').forEach(sv=>{sv._tok=(sv._tok||0)+1;});});
  $('#clrAll').onclick=async()=>{
    const my=++allTok;
    for(const s of shapes){if(my!==allTok||!app.isConnected)return;await playShape(svgOf(s.id));await new Promise(r=>setTimeout(r,500));}
  };
  /* 3 алхам: будалтыг тайван хөдөлгөж үзүүлнэ */
  $$('.stp').forEach(box=>{
    const cap=$('.cap',box),caps=STEP_CAP[box.dataset.k];
    const set=(n,anim)=>{
      $$('[data-st]',box).forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.st===n)));
      cap.textContent=caps[n-1];
      box._p=paintTo(box,n,anim);return box._p;
    };
    S.cleanup.push(()=>{box._tok=(box._tok||0)+1;box._auto=(box._auto||0)+1;});
    set(1,false);
    box.onclick=async e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.dataset.st){box._auto=(box._auto||0)+1;set(+b.dataset.st,true);}
      else if(b.dataset.auto){
        const my=box._auto=(box._auto||0)+1;
        for(const n of [1,2,3]){
          if(box._auto!==my)return;
          await set(n,n>1);
          if(box._auto!==my)return;
          await new Promise(r=>setTimeout(r,1000));
        }
      }
    };
  });
  app.onclick=e=>{
    const tr=e.target.closest('[data-try]');
    if(tr){const s=shapes.find(x=>x.id===tr.dataset.try);if(s){allTok++;practice(s);}return;}
    const t=e.target.closest('[data-play]');if(!t)return;
    const sv=svgOf(t.dataset.play);if(sv){allTok++;playShape(sv);}
  };
  S.cleanup.push(()=>{app.onclick=null;});
}

$('#fs').onclick=()=>{

  }catch(e){toast('Энд бүтэн дэлгэц нээгдсэнгүй');}
};
